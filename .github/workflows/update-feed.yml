name: Update MoCA RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,14,20 * * *'
      timezone: 'Asia/Taipei'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: moca-rss-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Generate RSS
        run: python generate_feed.py

      - name: Save RSS state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json docs/feed.xml docs/index.html
          if git diff --cached --quiet; then
            echo "No feed/state changes to commit."
          else
            git commit -m "chore: update MoCA RSS"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
